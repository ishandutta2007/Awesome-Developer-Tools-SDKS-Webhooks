<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>

    <!-- Filter for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
      fill: url(#primary-glow);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 0.2px;
      fill: #cbd5e1;
    }
    .badge-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }
    .pulse-node {
      animation: pulse 3s infinite ease-in-out;
    }
    .dash-line {
      stroke-dasharray: 8 6;
      animation: dash 15s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -100;
      }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }
    .orb-1 {
      animation: floatOrb 8s infinite ease-in-out;
    }
    .orb-2 {
      animation: floatOrb 10s infinite ease-in-out reverse;
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Cyber Grid -->
  <rect width="100%" height="100%" fill="url(#cyber-grid)" opacity="0.6" />

  <!-- Dynamic Glowing Ambient Orbs (Background only) -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="180" cy="80" r="90" fill="#38bdf8" opacity="0.15" />
    <circle class="orb-2" cx="1020" cy="280" r="110" fill="#818cf8" opacity="0.15" />
    <circle cx="600" cy="330" r="80" fill="#c084fc" opacity="0.12" />
  </g>

  <!-- Subtle dynamic data flow lines in the lower background -->
  <g opacity="0.35">
    <path class="dash-line" d="M 50 300 Q 300 240 600 300 T 1150 260" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="dash-line" d="M 80 320 Q 400 360 750 310 T 1120 330" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Border Frame -->
  <rect x="2" y="2" width="1196" height="356" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Foreground Content: Title, Subtitle, Badges -->
  <g id="foreground">
    <!-- Category Tag Top -->
    <g transform="translate(600, 70)">
      <rect x="-160" y="-18" width="320" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
      <circle cx="-135" cy="-1" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-120" y="4" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text class="title-text" x="600" y="145" text-anchor="middle">Developer Tools, SDKs &amp; Webhooks</text>

    <!-- Subtitle -->
    <text class="subtitle-text" x="600" y="195" text-anchor="middle">The Definitive Architectural Guide to SaaS Platforms &amp; Open-Source API Infrastructure</text>

    <!-- Interactive / Dynamic Feature Pills in Foreground -->
    <g transform="translate(600, 260)">
      <!-- Pill 1: SDK Generators -->
      <g transform="translate(-360, 0)">
        <rect x="-95" y="-18" width="190" height="38" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
        <text class="badge-label" x="0" y="5" text-anchor="middle">⚡ SDK Generation</text>
      </g>

      <!-- Pill 2: Webhook Engines -->
      <g transform="translate(-120, 0)">
        <rect x="-95" y="-18" width="190" height="38" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
        <text class="badge-label" x="0" y="5" text-anchor="middle">🔔 Webhook Delivery</text>
      </g>

      <!-- Pill 3: API Gateways -->
      <g transform="translate(120, 0)">
        <rect x="-95" y="-18" width="190" height="38" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
        <text class="badge-label" x="0" y="5" text-anchor="middle">🌐 API Infrastructure</text>
      </g>

      <!-- Pill 4: Open-Source First -->
      <g transform="translate(360, 0)">
        <rect x="-95" y="-18" width="190" height="38" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
        <text class="badge-label" x="0" y="5" text-anchor="middle">💻 100% Open-Source</text>
      </g>
    </g>

    <!-- Decorative Bottom Indicator -->
    <g transform="translate(600, 318)">
      <circle cx="-16" cy="0" r="3" fill="#38bdf8" opacity="0.8" />
      <circle cx="0" cy="0" r="4" fill="#818cf8" />
      <circle cx="16" cy="0" r="3" fill="#c084fc" opacity="0.8" />
    </g>
  </g>
</svg>
